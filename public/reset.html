<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiornamento USAR Veneto</title>
  <style>
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #B22222; color: #fff;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .box { max-width: 420px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { font-size: 15px; opacity: 0.9; }
    .stato { margin-top: 20px; font-size: 14px; background: rgba(255,255,255,0.15); border-radius: 10px; padding: 12px 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔄 Aggiornamento dell'app</h1>
    <p>Un momento: sto rimuovendo la vecchia copia salvata sul telefono…</p>
    <div class="stato" id="stato">Pulizia in corso…</div>
  </div>
  <script>
    (async () => {
      const stato = document.getElementById('stato');
      try {
        if ('caches' in window) {
          const chiavi = await caches.keys();
          await Promise.all(chiavi.map(k => caches.delete(k)));
          stato.textContent = 'Salvataggi rimossi (' + chiavi.length + ').';
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
          stato.textContent += ' Vecchio servizio rimosso.';
        }
        localStorage.clear();
        sessionStorage.clear();
        stato.textContent += ' Rientro nell’app…';
      } catch (e) {
        stato.textContent = 'Problema: ' + e.message;
      }
      setTimeout(() => { location.replace('/App-Usar-Veneto/'); }, 1500);
    })();
  </script>
</body>
</html>
